.dg-copy{fill:none;stroke:var(--d-blue,#0062A2);stroke-width:1.6;stroke-dasharray:6 4}
.dg-tr{fill:var(--d-tr,#FAB219);stroke:var(--d-line,#272623);stroke-width:1}
.dg-band{fill:var(--d-lane2,#F3F1EE);stroke:var(--d-grid,#D6D3CE);stroke-width:1.2}
