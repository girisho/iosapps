</defs><rect class="dg-bg" x="0" y="0" width="1600" height="430"/><text class="dg-t" font-size="12.5" text-anchor="start" font-weight="bold"><tspan x="20.0" y="28.4">Upgrade sequence and who does what (SAP Upgrade Guide 2.2, NorthStar owners)</tspan></text><path class="dg-chev" d="M20,44 L312,44 L330,66 L312,88 L20,88 L20,66 z"/><text class="dg-t" font-size="12" text-anchor="middle" font-weight="bold"><tspan x="175.0" y="70.2">Plan phase</tspan></text><path class="dg-chev" d="M330,44 L942,44 L960,66 L942,88 L330,88 L348,66 z"/><text class="dg-t" font-size="12" text-anchor="middle" font-weight="bold"><tspan x="645.0" y="70.2">Prepare phase</tspan></text><path class="dg-chev2" d="M960,44 L1212,44 L1230,66 L1212,88 L960,88 L978,66 z"/><text class="dg-tw" font-size="12" text-anchor="middle" font-weight="bold"><tspan x="1095.0" y="70.2">Realize phase</tspan></text><path class="dg-chev2" d="M1230,44 L1562,44 L1580,66 L1562,88 L1230,88 L1248,66 z"/><text class="dg-tw" font-size="12" text-anchor="middle" font-weight="bold"><tspan x="1405.0" y="70.2">Follow-up phase</tspan></text><path class="dg-seq" d="M30.0,112.0 L1585.0,112.0" marker-end="url(#seqarw)"/><circle class="dg-ev" cx="100" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="100.0" y="115.5">t1</tspan></text><rect class="dg-step" x="28.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="100.0" y="154.0">Landscape strategy: XS4 &gt;</tspan><tspan x="100.0" y="165.4">DS4 &gt; QS4 &gt; SS4 &gt; PS4;</tspan><tspan x="100.0" y="176.7">DS5 / QS5 copies</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="100.0" y="205.2">INTL Basis</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="100.0" y="238.9">UG 3.1</tspan></text><circle class="dg-ev" cx="255" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="255.0" y="115.5">t2</tspan></text><rect class="dg-step" x="183.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="255.0" y="154.0">Modification and</tspan><tspan x="255.0" y="165.4">enhancement planning; Z</tspan><tspan x="255.0" y="176.7">package; passive deletion</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="255.0" y="205.2">PwC Technical</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="255.0" y="238.9">UG 3.5</tspan></text><circle class="dg-ev" cx="410" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="410.0" y="115.5">t3</tspan></text><rect class="dg-step" x="338.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="410.0" y="159.7">Maintenance Planner: MPID</tspan><tspan x="410.0" y="171.0">per system</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="410.0" y="205.2">INTL Basis (+ ECS)</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="410.0" y="238.9">UG 4.2</tspan></text><circle class="dg-ev" cx="565" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="565.0" y="115.5">t4</tspan></text><rect class="dg-step" x="493.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="565.0" y="159.7">System requirements:</tspan><tspan x="565.0" y="171.0">HANA, kernel, OS</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="565.0" y="205.2">SAP ECS</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="565.0" y="238.9">UG 4.3</tspan></text><circle class="dg-ev" cx="720" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="720.0" y="115.5">t5</tspan></text><rect class="dg-step" x="648.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="720.0" y="159.7">Custom code (ATC) and</tspan><tspan x="720.0" y="171.0">SI-check pre-checks</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="720.0" y="205.2">PwC + INTL Basis</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="720.0" y="238.9">UG 4.4, 4.5</tspan></text><circle class="dg-ev" cx="875" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="875.0" y="115.5">t6</tspan></text><rect class="dg-step" x="803.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="875.0" y="159.7">Application preparation;</tspan><tspan x="875.0" y="171.0">partner confirmations</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="875.0" y="205.2">PwC Functional + INTL Basis</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="875.0" y="238.9">UG 4.2</tspan></text><circle class="dg-ev" cx="1095" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="1095.0" y="115.5">t7</tspan></text><rect class="dg-step" x="1023.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="1095.0" y="159.7">Software Update Manager</tspan><tspan x="1095.0" y="171.0">(SUM) runs per system</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="1095.0" y="205.2">SAP ECS (SPDD: PwC)</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="1095.0" y="238.9">UG 5</tspan></text><circle class="dg-ev" cx="1320" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="1320.0" y="115.5">t8</tspan></text><rect class="dg-step" x="1248.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="1320.0" y="159.7">Technical follow-up:</tspan><tspan x="1320.0" y="171.0">SDMI, Fiori, SU25 / roles</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="1320.0" y="205.2">INTL Basis + INTL Security</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="1320.0" y="238.9">UG 6.1, 6.3, 6.4</tspan></text><circle class="dg-ev" cx="1490" cy="112" r="11"/><text class="dg-t" font-size="8.5" text-anchor="middle" font-weight="bold"><tspan x="1490.0" y="115.5">t9</tspan></text><rect class="dg-step" x="1418.0" y="132.0" width="144.0" height="90.0" rx="8"/><text class="dg-t" font-size="9.6" text-anchor="middle"><tspan x="1490.0" y="159.7">Application follow-up and</tspan><tspan x="1490.0" y="171.0">testing</tspan></text><text class="dg-tm" font-size="9" text-anchor="middle" font-weight="bold"><tspan x="1490.0" y="205.2">PwC + INTL Test / Business</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="middle"><tspan x="1490.0" y="238.9">UG 6</tspan></text><rect class="dg-band2" x="28.0" y="262.0" width="920.0" height="40.0" rx="8"/><text class="dg-t" font-size="9.4" text-anchor="middle"><tspan x="488.0" y="285.3">SI-check (/SDF/RC_START_CHECK) and side-effect report replace the Readiness Check for an SPS update (UG 2.1)</tspan></text><text class="dg-t" font-size="10" text-anchor="start" font-weight="bold"><tspan x="30.0" y="333.5">Plan + Prepare:</tspan></text><text class="dg-t" font-size="10" text-anchor="start"><tspan x="160.0" y="333.5">15 - 23 Oct (G0 Thu 22 Oct)</tspan></text><text class="dg-t" font-size="10" text-anchor="start" font-weight="bold"><tspan x="30.0" y="357.5">Realize:</tspan></text><text class="dg-t" font-size="10" text-anchor="start"><tspan x="160.0" y="357.5">XS4 24 Oct, DS4 31 Oct, QS4 7 Nov, SS4 13-14 Nov, PS4 20-21 Nov</tspan></text><text class="dg-t" font-size="10" text-anchor="start" font-weight="bold"><tspan x="30.0" y="381.5">Follow-up:</tspan></text><text class="dg-t" font-size="10" text-anchor="start"><tspan x="160.0" y="381.5">Sunday after each window; SDMI and side-effect watch to go-live</tspan></text><text class="dg-tm" font-size="8.4" text-anchor="start"><tspan x="30.0" y="412.9">Adapted from SAP Upgrade Guide for S/4HANA Cloud Private Edition 2023 (v6.0), section 2.2 figure &quot;Upgrade to SAP S/4HANA Cloud Private Edition: Sequence&quot;.</tspan></text></svg>