<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 430" role="img" aria-label="NorthStar upgrade sequence and responsibilities (adapted from SAP Upgrade Guide figure, section 2.2)"><title>NorthStar upgrade sequence and responsibilities (adapted from SAP Upgrade Guide figure, section 2.2)</title><style>
