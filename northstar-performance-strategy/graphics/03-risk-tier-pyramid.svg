<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680"><title>Risk-tiered scope: test deeply where the risk is</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#272623"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#272623"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E8E9EB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#BAB9B5" stroke-width="3"/></pattern></defs><rect width="1600" height="680" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#FF7144" stroke="none" stroke-width="0"/><text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#272623" font-weight="bold" text-anchor="start" >RISK-TIERED SCOPE: TEST DEEPLY WHERE THE RISK IS</text><text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#82817D" font-weight="normal" text-anchor="start" >Replace several hundred bespoke tests with about 35 scripted scenarios, about 70 component checks, and telemetry</text><g transform="translate(0,90)"><polygon points="560,40 720,210 400,210" fill="#FF7144" stroke="#FFFFFF" stroke-width="4"/><text x="560" y="148" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#272623" font-weight="bold" text-anchor="middle" >TIER 1</text><text x="560" y="172" font-family="Arial, Helvetica, sans-serif" font-size="14.5" fill="#272623" font-weight="bold" text-anchor="middle" >~35 E2E scenarios</text><polygon points="400,220 720,220 920.0,390 200,390" fill="#272623" stroke="#FFFFFF" stroke-width="4"/><text x="560" y="268" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >TIER 2</text><text x="560" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >~60 to 80 component checks</text><text x="560" y="318.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >Top interfaces and batch jobs</text><text x="560" y="335.55" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >Volume injection, no UI scripting</text><polygon points="200,400 920,400 1100.0,570 20,570" fill="#4E5659" stroke="#FFFFFF" stroke-width="4"/><text x="560" y="448" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >TIER 3</text><text x="560" y="472" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Everything else (hundreds of objects)</text><text x="560" y="498.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >Telemetry watch during SIT2 and UAT</text><text x="560" y="515.55" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FFFFFF" font-weight="normal" text-anchor="middle" >Promote any outlier to Tier 2</text><text x="40" y="120.0" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Scripted end-to-end with</text><text x="40" y="137.55" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >NeoLoad: load, stress and</text><text x="40" y="155.1" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >endurance at design peak</text><line x1="205" y1="135" x2="432" y2="168" stroke="#272623" stroke-width="1.2" marker-end="url(#arr)"/><rect x="1130" y="40" width="450" height="530" rx="12" fill="#EEF2F7" stroke="#C9D3E0" stroke-width="1"/><text x="1154" y="78" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#272623" font-weight="bold" text-anchor="start" >HOW AN OBJECT EARNS ITS TIER</text><text x="1154" y="112" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >Risk score = Volume x Criticality x Complexity</text><text x="1154" y="134" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >each scored 1 to 5, so 1 to 125</text><rect x="1154" y="160" width="110" height="38" rx="6" fill="#FF7144" stroke="none" stroke-width="0"/><text x="1209" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="middle" >Tier 1</text><text x="1280" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="normal" text-anchor="start" >48 and above</text><rect x="1154" y="212" width="110" height="38" rx="6" fill="#272623" stroke="none" stroke-width="0"/><text x="1209" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Tier 2</text><text x="1280" y="237" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="normal" text-anchor="start" >20 to 47</text><rect x="1154" y="264" width="110" height="38" rx="6" fill="#4E5659" stroke="none" stroke-width="0"/><text x="1209" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="bold" text-anchor="middle" >Tier 3</text><text x="1280" y="289" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="normal" text-anchor="start" >below 20</text><text x="1154" y="340" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >Automatic Tier 1 overrides</text><text x="1154" y="366" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Regulatory: DRC Mexico CFDI, tax</text><text x="1154" y="390" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Financial truth: CFIN JE feed, trial balance</text><text x="1154" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Known pain: VIM</text><text x="1154" y="438" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Revenue: truck order to invoice</text><text x="1154" y="462" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >Shared choke points: OneSource, number</text><text x="1154" y="486" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#333B42" font-weight="normal" text-anchor="start" >ranges, Cloud Connector, JMS</text><text x="1154" y="530" font-family="Arial, Helvetica, sans-serif" font-size="13.5" fill="#FF7144" font-weight="bold" text-anchor="start" >Any Tier 3 outlier seen in telemetry is promoted.</text></g></svg>