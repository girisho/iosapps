<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="810" viewBox="0 0 1600 810"><title>Reading results from a 50% pre-prod</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#272623"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#272623"/></marker><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#E8E9EB"/><line x1="0" y1="0" x2="0" y2="8" stroke="#BAB9B5" stroke-width="3"/></pattern></defs><rect width="1600" height="810" fill="#FFFFFF"/><rect x="0" y="0" width="1600" height="8" rx="0" fill="#FF7144" stroke="none" stroke-width="0"/><text x="40" y="50" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#272623" font-weight="bold" text-anchor="start" >READING RESULTS FROM A 50% PRE-PROD</text><text x="40" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#82817D" font-weight="normal" text-anchor="start" >Three classes of metrics, three different rules for translating to production</text><g transform="translate(0,90)"><rect x="20" y="20" width="507" height="96" rx="10" fill="#0062A2" stroke="none" stroke-width="0"/><circle cx="54" cy="68" r="18" fill="#FFFFFF"/><text x="54" y="74" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0062A2" text-anchor="middle">A</text><text x="86" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >RESPONSE TIME AND SINGLE-THREAD RUNTIME</text><text x="86" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="normal" text-anchor="start" >Does not scale with capacity</text><rect x="20" y="126" width="507" height="300" rx="10" fill="#E8E9EB" stroke="none" stroke-width="0"/><text x="40" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Why</text><text x="40" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Same CPU generation and same data</text><text x="40" y="200.2" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >volume means about the same result</text><text x="40" y="218.4" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >in pre-prod and PRD.</text><text x="40" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Examples</text><circle cx="46" cy="281" r="3.5" fill="#0062A2"/><text x="58" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >VSM truck configuration step</text><circle cx="46" cy="305" r="3.5" fill="#0062A2"/><text x="58" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Single batch job runtime</text><circle cx="46" cy="329" r="3.5" fill="#0062A2"/><text x="58" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >One OneSource call, one CFDI stamp</text><rect x="34" y="358" width="479" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3E0" stroke-width="1"/><text x="48" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >Test at real single-user and peak pacing. Pre-prod result</text><text x="48" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >is the PRD forecast.</text><rect x="547" y="20" width="507" height="96" rx="10" fill="#272623" stroke="none" stroke-width="0"/><circle cx="581" cy="68" r="18" fill="#FFFFFF"/><text x="581" y="74" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#272623" text-anchor="middle">B</text><text x="613" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >THROUGHPUT AND CONCURRENCY</text><text x="613" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#FFFFFF" font-weight="normal" text-anchor="start" >Scales with SAP capacity, not linearly</text><rect x="547" y="126" width="507" height="300" rx="10" fill="#E8E9EB" stroke="none" stroke-width="0"/><text x="567" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Why</text><text x="567" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Pre-prod is about 50% of PRD, so</text><text x="567" y="200.2" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >50% of design load in pre-prod is</text><text x="567" y="218.4" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >roughly 100% PRD-equivalent.</text><text x="567" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Examples</text><circle cx="573" cy="281" r="3.5" fill="#272623"/><text x="585" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Concurrent Fiori and GUI users</text><circle cx="573" cy="305" r="3.5" fill="#272623"/><text x="585" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Billing run invoices per hour</text><circle cx="573" cy="329" r="3.5" fill="#272623"/><text x="585" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >CFIN JE lines posted per hour</text><rect x="561" y="358" width="479" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3E0" stroke-width="1"/><text x="575" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >Step to 50% then push to the break point. PRD = measured x</text><text x="575" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >ratio x 0.85 derate.</text><rect x="1074" y="20" width="507" height="96" rx="10" fill="#FF7144" stroke="none" stroke-width="0"/><circle cx="1108" cy="68" r="18" fill="#272623"/><text x="1108" y="74" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#FFFFFF" text-anchor="middle">C</text><text x="1140" y="58" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#272623" font-weight="bold" text-anchor="start" >FIXED SHARED AND EXTERNAL LIMITS</text><text x="1140" y="84" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="normal" text-anchor="start" >Same limit in pre-prod and PRD</text><rect x="1074" y="126" width="507" height="300" rx="10" fill="#E8E9EB" stroke="none" stroke-width="0"/><text x="1094" y="158" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Why</text><text x="1094" y="182.0" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Bottlenecks outside the SAP</text><text x="1094" y="200.2" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >app and HANA tiers do not get</text><text x="1094" y="218.4" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >bigger in production.</text><text x="1094" y="262" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#82817D" font-weight="bold" text-anchor="start" >Examples</text><circle cx="1100" cy="281" r="3.5" fill="#FF7144"/><text x="1112" y="286" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >BTP tenant, JMS, EOIO queues</text><circle cx="1100" cy="305" r="3.5" fill="#FF7144"/><text x="1112" y="310" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >Cloud Connector, number range locks</text><circle cx="1100" cy="329" r="3.5" fill="#FF7144"/><text x="1112" y="334" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#333B42" font-weight="normal" text-anchor="start" >OneSource, PAC, Pega, legacy</text><rect x="1088" y="358" width="479" height="56" rx="8" fill="#FFFFFF" stroke="#C9D3E0" stroke-width="1"/><text x="1102" y="381" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >Test at full 100% to 150% PRD design load. Half load here</text><text x="1102" y="401" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#272623" font-weight="bold" text-anchor="start" >hides the real failure.</text><text x="20" y="460" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#272623" font-weight="bold" text-anchor="start" >PRE-PROD LOAD LADDER (percent of PRD design peak; design peak = 1.5 x measured peak hour)</text><rect x="20" y="620" width="296" height="40" rx="6" fill="#0062A2" stroke="none" stroke-width="0"/><text x="34" y="646" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Calibrate</text><text x="20" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >Single user and 10%</text><text x="20" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >Confirm scaling ratio</text><rect x="336" y="590" width="296" height="70" rx="6" fill="#272623" stroke="none" stroke-width="0"/><text x="350" y="616" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Step 1</text><text x="336" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >50% design load</text><text x="336" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >About 100% PRD-equivalent for class B</text><rect x="652" y="560" width="296" height="100" rx="6" fill="#5C1916" stroke="none" stroke-width="0"/><text x="666" y="586" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Step 2</text><text x="652" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >100% design load</text><text x="652" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >Class C limits at full PRD volume</text><rect x="968" y="530" width="296" height="130" rx="6" fill="#FF7144" stroke="none" stroke-width="0"/><text x="982" y="556" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#272623" font-weight="bold" text-anchor="start" >Step 3</text><text x="968" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >Ramp to break</text><text x="968" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >Find the knee, headroom margin</text><rect x="1284" y="590" width="296" height="70" rx="6" fill="#4E5659" stroke="none" stroke-width="0"/><text x="1298" y="616" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="start" >Soak</text><text x="1284" y="686" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#272623" font-weight="bold" text-anchor="start" >50% for 8 hours</text><text x="1284" y="706" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#333B42" font-weight="normal" text-anchor="start" >Memory growth, queue drift</text></g></svg>